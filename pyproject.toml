[project]
name = "keel"
version = "0.1.0"
description = "A governed agentic orchestrator for the software lifecycle"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk[http-server]>=1.1.2",
    "anthropic>=0.125.0",
    "fastapi>=0.141.0",
    "uvicorn>=0.52.0",
    "httpx>=0.28.0",
    "rich>=15.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0", "pytest-asyncio>=1.4"]

[project.scripts]
keel = "keel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["keel"]

[tool.pytest.ini_options]
# Scoped to our own tests. `runs/` holds generated services with their own
# suites, which are executed by the verification gate inside a run and must not
# be collected into this one.
testpaths = ["tests"]
norecursedirs = ["runs", ".venv", "*.egg-info"]
asyncio_mode = "auto"
markers = ["http: binds a local port, deselect with -m 'not http'"]
filterwarnings = ["ignore::DeprecationWarning:a2a.*"]
